<!DOCTYPE html>
<html lang="fr" data-theme="love">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nous Deux — l'agenda du couple</title>
  <meta name="description" content="L'agenda partagé pour organiser vos sorties, vos dates et vos activités à deux." />
  <meta name="theme-color" content="#fff5f8" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Nous Deux" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Anti-FOUC : applique le thème (et sa couleur de barre de statut) AVANT
    // le premier rendu, pour éviter un flash du thème par défaut (rose)
    // quand un thème différent a été choisi. Garder BG synchronisé avec les
    // valeurs --bg de css/styles.css.
    (function () {
      var BG = { light: '#f6f7fb', dark: '#14161f', love: '#fff5f8', nature: '#f2f8f1', space: '#0d0b1c' };
      var DARK = { dark: true, space: true };
      var id = 'love';
      try {
        var raw = window.localStorage.getItem('nousdeux.data');
        var theme = raw && JSON.parse(raw).settings && JSON.parse(raw).settings.theme;
        if (Object.prototype.hasOwnProperty.call(BG, theme)) id = theme;
      } catch (e) { /* pas grave : on garde le thème par défaut */ }
      document.documentElement.setAttribute('data-theme', id);
      document.documentElement.style.colorScheme = DARK[id] ? 'dark' : 'light';
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', BG[id]);
    })();
  </script>
</head>
<body>
  <main id="view" class="view"></main>

  <button id="fab" class="fab" type="button" aria-label="Nouvel événement">+</button>

  <nav id="tabbar" class="tabbar" aria-label="Navigation principale"></nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/version.js"></script>
  <script src="js/config.js"></script>
  <script src="js/dates.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/stickers.js"></script>
  <script src="js/event-form.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/agenda.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
