<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>DailyOS</title>
  <meta name="description" content="DailyOS - Organisation personnelle : tâches, planning, projets, courses et notes." />

  <meta name="theme-color" content="#05050a" />
  <link rel="manifest" href="./manifest.json" />

  <link rel="icon" href="./icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DailyOS" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="ambient-bg" aria-hidden="true"></div>

  <div id="app">
    <main id="view-root" class="view-root"></main>

    <nav class="bottom-nav">
      <button class="nav-item" data-action="go-home" data-view="home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/><path d="M9.5 20v-6h5v6"/></svg>
        <span>Accueil</span>
      </button>
      <button class="nav-item" data-action="go-tasks" data-view="tasks">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 12l2.5 2.5L16 9"/></svg>
        <span>Tâches</span>
      </button>
      <div class="nav-fab-wrap">
        <button class="nav-fab" data-action="open-add-modal" aria-label="Ajouter">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5v15M4.5 12h15"/></svg>
        </button>
      </div>
      <button class="nav-item" data-action="go-planning" data-view="planning">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17"/><path d="M8 3v3.5M16 3v3.5"/></svg>
        <span>Planning</span>
      </button>
      <button class="nav-item" data-action="go-projects" data-view="projects">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7a1.5 1.5 0 0 1 1.5-1.5h4l2 2h8a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18Z"/></svg>
        <span>Projets</span>
      </button>
    </nav>

    <div id="modal-overlay" class="modal-overlay" aria-hidden="true">
      <div id="modal-sheet" class="modal-sheet"></div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
